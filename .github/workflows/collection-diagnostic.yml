name: Eight-game collection check (no AI or delivery)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-pm-morning-brief
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect eight games without analysis or delivery
        run: python -m app.collection_diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-check-${{ github.run_id }}
          path: output/
          retention-days: 7
