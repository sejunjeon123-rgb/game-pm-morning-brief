name: Slack and Notion report preview (no AI or collection)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-pm-platform-preview-test
  cancel-in-progress: false

jobs:
  deliver-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Create Notion preview and send Slack link
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ vars.NOTION_PARENT_PAGE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m app.platform_preview_test
